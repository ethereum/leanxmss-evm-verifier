name = "LeanXmssFv"
defaultTargets = ["LeanXmssFv"]

# EthLib at the commit in contracts/test/vectors/ethlib/COMMIT. CI checks that the two agree.
[[require]]
name = "EthLib"
git = "https://github.com/ethereum/EthLib"
rev = "6630abba6344f9d15ae139d4bddbb74baf6285ea"

# Every file is a module, as in EthLib, so that the logic in `Logic/` can move upstream as it is.
[[lean_lib]]
name = "LeanXmssFv"
requiresModuleSystem = true
